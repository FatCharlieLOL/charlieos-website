<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex,nofollow">

  <title>SMT Admin Console</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>

    /* ========== CSS VARIABLES ========== */

    :root {

      --color-primary: #1B6B5A;

      --color-primary-dark: #145547;

      --color-primary-light: #2A9D8F;

      --color-primary-pale: #E8F5F1;

      --color-gold: #C9A96E;

      --color-charcoal: #2D2D2D;

      --color-white: #FFFFFF;

      --color-error: #D32F2F;

      --color-success: #2E7D32;



      --admin-bg: #F7F8FA;

      --admin-surface: #FFFFFF;

      --admin-border: #E5E7EB;

      --admin-border-strong: #D1D5DB;

      --admin-text-primary: #111827;

      --admin-text-secondary: #6B7280;

      --admin-text-tertiary: #9CA3AF;

      --admin-accent: #1B6B5A;

      --admin-accent-hover: #145547;

      --admin-accent-pale: #E8F5F1;

      --admin-warning: #D97706;

      --admin-warning-pale: #FEF3C7;

      --admin-danger: #DC2626;

      --admin-danger-pale: #FEE2E2;

      --admin-success-pale: #D1FAE5;

      --admin-info: #2563EB;

      --admin-info-pale: #DBEAFE;



      --font-heading: 'Playfair Display', 'Noto Serif SC', Georgia, serif;

      --font-body: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;

      --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;



      --space-xs: 0.25rem;

      --space-sm: 0.5rem;

      --space-md: 1rem;

      --space-lg: 1.5rem;

      --space-xl: 2rem;

      --space-2xl: 3rem;



      --radius-sm: 4px;

      --radius-md: 8px;

      --radius-lg: 12px;

      --radius-full: 9999px;



      --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);

      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);

      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);

      --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);



      --transition-fast: 150ms ease;

      --transition-base: 250ms ease;



      --sidebar-width: 240px;

      --sidebar-collapsed: 64px;

      --topbar-height: 56px;

    }



    /* ========== DARK MODE ========== */

    [data-theme="dark"] {

      --admin-bg: #0F1115;

      --admin-surface: #1A1D23;

      --admin-border: #2A2E36;

      --admin-border-strong: #3A3F4A;

      --admin-text-primary: #E5E7EB;

      --admin-text-secondary: #9CA3AF;

      --admin-text-tertiary: #6B7280;

      --admin-accent: #2A9D8F;

      --admin-accent-hover: #38B2A4;

      --admin-accent-pale: rgba(42,157,143,0.15);

      --admin-warning-pale: rgba(217,119,6,0.15);

      --admin-danger-pale: rgba(220,38,38,0.15);

      --admin-success-pale: rgba(46,125,50,0.15);

      --admin-info-pale: rgba(37,99,235,0.15);

      --shadow-xs: 0 1px 2px rgba(0,0,0,0.2);

      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);

      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);

      --shadow-lg: 0 8px 30px rgba(0,0,0,0.5);

    }

    [data-theme="dark"] .role-badge.viewer { background: rgba(124,58,237,0.15); color: #A78BFA; }

    [data-theme="dark"] .login-box { background: var(--admin-surface); }

    [data-theme="dark"] .modal-content { background: var(--admin-surface); }

    [data-theme="dark"] .badge-shipped { background: rgba(124,58,237,0.15); color: #A78BFA; }

    [data-theme="dark"] .badge-vip { background: rgba(217,119,6,0.15); color: #FBBF24; }



    /* ========== RESET ========== */

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-font-smoothing: antialiased; }

    body {

      font-family: var(--font-body);

      font-size: 13px;

      line-height: 1.6;

      color: var(--admin-text-primary);

      background: var(--admin-bg);

    }

    a { color: var(--admin-accent); text-decoration: none; }

    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    input, select, textarea { font-family: inherit; font-size: 13px; }



    /* ========== LOGIN SCREEN ========== */

    #loginScreen {

      position: fixed; inset: 0; z-index: 9999;

      display: flex; align-items: center; justify-content: center;

      background: var(--admin-bg);

    }

    .login-card {

      width: 360px; background: var(--admin-surface);

      border-radius: var(--radius-lg); box-shadow: var(--shadow-md);

      padding: var(--space-2xl);

      animation: fadeUp 400ms ease;

    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .login-logo {

      text-align: center; margin-bottom: var(--space-xl);

    }

    .login-logo h1 {

      font-family: var(--font-heading); font-size: 28px; font-weight: 700;

      color: var(--color-gold); letter-spacing: 2px;

    }

    .login-logo p {

      font-size: 12px; color: var(--admin-text-secondary);

      text-transform: uppercase; letter-spacing: 1px; margin-top: 4px;

    }

    .login-form .form-group { margin-bottom: var(--space-md); }

    .login-form label {

      display: block; font-size: 12px; font-weight: 600;

      color: var(--admin-text-secondary); margin-bottom: 6px;

      text-transform: uppercase; letter-spacing: 0.5px;

    }

    .login-form input {

      width: 100%; padding: 10px 12px;

      border: 1px solid var(--admin-border-strong); border-radius: var(--radius-md);

      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);

    }

    .login-form input:focus {

      outline: none; border-color: var(--admin-accent);

      box-shadow: 0 0 0 3px var(--admin-accent-pale);

    }

    .login-btn {

      width: 100%; padding: 11px; background: var(--admin-accent);

      color: #fff; border-radius: var(--radius-md); font-weight: 600; font-size: 14px;

      transition: background var(--transition-fast), transform var(--transition-fast);

    }

    .login-btn:hover { background: var(--admin-accent-hover); transform: translateY(-1px); }

    .login-btn:active { transform: translateY(0); }

    .login-error {

      color: var(--admin-danger); font-size: 12px; margin-top: var(--space-sm);

      display: none;

    }

    .login-error.show { display: block; animation: shake 300ms ease; }

    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

    .login-demo {

      margin-top: var(--space-lg); padding-top: var(--space-md);

      border-top: 1px solid var(--admin-border);

      font-size: 11px; color: var(--admin-text-tertiary); text-align: center; line-height: 1.8;

    }

    .login-demo code {

      font-family: var(--font-mono); background: var(--admin-bg);

      padding: 2px 6px; border-radius: var(--radius-sm); color: var(--admin-text-secondary);

    }



    /* ========== APP LAYOUT ========== */

    #appLayout { display: none; }

    #appLayout.show { display: flex; }



    /* ========== SIDEBAR ========== */

    #sidebar {

      width: var(--sidebar-width); background: var(--admin-surface);

      border-right: 1px solid var(--admin-border);

      display: flex; flex-direction: column; flex-shrink: 0;

      position: fixed; top: 0; bottom: 0; left: 0; z-index: 100;

      transition: width var(--transition-base);

    }

    .sidebar-header {

      height: var(--topbar-height); display: flex; align-items: center;

      padding: 0 var(--space-lg); border-bottom: 1px solid var(--admin-border);

    }

    .sidebar-header .logo {

      font-family: var(--font-heading); font-size: 20px; font-weight: 700;

      color: var(--color-gold); letter-spacing: 1px;

    }

    .sidebar-header .logo span { color: var(--admin-text-tertiary); font-size: 11px; font-weight: 400; font-family: var(--font-body); margin-left: 6px; }

    .sidebar-nav { flex: 1; padding: var(--space-sm) 0; overflow-y: auto; }

    .nav-item {

      display: flex; align-items: center; gap: 10px;

      padding: 10px var(--space-lg); font-size: 13px; font-weight: 500;

      color: var(--admin-text-secondary); cursor: pointer;

      transition: all var(--transition-fast);

      border-left: 2px solid transparent;

      position: relative;

    }

    .nav-item:hover { background: var(--admin-bg); color: var(--admin-text-primary); }

    .nav-item.active {

      background: var(--admin-accent-pale); color: var(--admin-accent);

      border-left-color: var(--admin-accent); font-weight: 600;

    }

    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }

    .sidebar-footer {

      padding: var(--space-md) var(--space-lg); border-top: 1px solid var(--admin-border);

    }

    .sidebar-user { display: flex; align-items: center; gap: 8px; margin-bottom: var(--space-sm); }

    .sidebar-user .avatar {

      width: 32px; height: 32px; border-radius: var(--radius-full);

      background: var(--admin-accent); color: #fff;

      display: flex; align-items: center; justify-content: center;

      font-size: 13px; font-weight: 600; flex-shrink: 0;

    }

    .sidebar-user .info { overflow: hidden; }

    .sidebar-user .name { font-size: 12px; font-weight: 600; color: var(--admin-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .sidebar-user .role { font-size: 11px; color: var(--admin-text-tertiary); }

    .logout-btn {

      width: 100%; padding: 7px; font-size: 12px; font-weight: 500;

      color: var(--admin-text-secondary); border-radius: var(--radius-md);

      transition: all var(--transition-fast);

    }

    .logout-btn:hover { background: var(--admin-danger-pale); color: var(--admin-danger); }



    /* ========== MAIN CONTENT ========== */

    #mainWrap {

      flex: 1; margin-left: var(--sidebar-width);

      display: flex; flex-direction: column; min-height: 100vh;

      transition: margin-left var(--transition-base);

    }

    #topbar {

      height: var(--topbar-height); background: var(--admin-surface);

      border-bottom: 1px solid var(--admin-border);

      display: flex; align-items: center; justify-content: space-between;

      padding: 0 var(--space-xl); position: sticky; top: 0; z-index: 50;

    }

    .topbar-left { display: flex; align-items: center; gap: var(--space-md); }

    .topbar-title { font-size: 18px; font-weight: 600; color: var(--admin-text-primary); }

    .topbar-right { display: flex; align-items: center; gap: var(--space-md); }

    .lang-switch {

      display: flex; gap: 2px; background: var(--admin-bg);

      border-radius: var(--radius-md); padding: 2px;

    }

    .lang-switch button {

      padding: 4px 10px; font-size: 12px; font-weight: 500;

      border-radius: var(--radius-sm); color: var(--admin-text-secondary);

      transition: all var(--transition-fast);

    }

    .lang-switch button.active { background: var(--admin-surface); color: var(--admin-accent); box-shadow: var(--shadow-xs); }

    .role-badge {

      font-size: 11px; font-weight: 600; padding: 3px 8px;

      border-radius: var(--radius-full); text-transform: uppercase; letter-spacing: 0.5px;

    }

    .role-badge.admin { background: var(--admin-accent-pale); color: var(--admin-accent); }

    .role-badge.manager { background: var(--admin-info-pale); color: var(--admin-info); }

    .role-badge.viewer { background: #F3E8FF; color: #7C3AED; }



    /* DEMO Badge */

    .demo-badge {

      font-size: 10px; font-weight: 700; padding: 2px 7px;

      border-radius: var(--radius-sm); letter-spacing: 1px;

      background: var(--admin-danger); color: #fff;

      text-transform: uppercase; line-height: 1.4;

      animation: demoPulse 2s ease-in-out infinite;

    }

    @keyframes demoPulse { 0%,100%{opacity:1} 50%{opacity:0.65} }

    .sidebar-demo-badge {

      margin: 0 var(--space-lg) var(--space-sm); padding: 6px 10px; text-align: center;

      font-size: 11px; font-weight: 700; background: var(--admin-danger-pale); color: var(--admin-danger);

      border: 1px dashed var(--admin-danger); border-radius: var(--radius-md);

    }

    .theme-toggle {

      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;

      border-radius: var(--radius-md); color: var(--admin-text-secondary);



      transition: all var(--transition-fast); border: 1px solid var(--admin-border);

      background: transparent; cursor: pointer;

    }

    .theme-toggle:hover { background: var(--admin-bg); color: var(--admin-accent); }

    .theme-toggle svg { width: 16px; height: 16px; }

    [data-theme="dark"] .lang-switch button { color: var(--admin-text-secondary); }

    [data-theme="dark"] .lang-switch button.active { color: var(--admin-accent); border-color: var(--admin-accent); }

    #mainContent { flex: 1; padding: var(--space-xl); animation: fadeIn 200ms ease; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }



    /* ========== COMPONENTS ========== */

    .page-header { margin-bottom: var(--space-xl); }

    .page-header h2 { font-size: 20px; font-weight: 600; }

    .page-header p { font-size: 13px; color: var(--admin-text-secondary); margin-top: 2px; }



    .section-title {

      font-size: 12px; font-weight: 600; color: var(--admin-text-tertiary);

      text-transform: uppercase; letter-spacing: 0.5px;

      margin-bottom: var(--space-md); margin-top: var(--space-xl);

    }

    .section-title:first-child { margin-top: 0; }



    /* KPI Cards */

    .kpi-grid { display: grid; gap: var(--space-md); margin-bottom: var(--space-xl); }

    .kpi-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

    .kpi-grid.cols-6 { grid-template-columns: repeat(6, 1fr); }

    .kpi-card {

      background: var(--admin-surface); border: 1px solid var(--admin-border);

      border-radius: var(--radius-lg); padding: 20px 24px;

      transition: box-shadow var(--transition-fast);

    }

    .kpi-card:hover { box-shadow: var(--shadow-sm); }

    .kpi-card .label { font-size: 11px; font-weight: 600; color: var(--admin-text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; }

    .kpi-card .value { font-family: var(--font-heading); font-size: 28px; font-weight: 600; color: var(--admin-text-primary); margin: 6px 0 4px; line-height: 1.2; }

    .kpi-card .sub { font-size: 12px; color: var(--admin-text-secondary); display: flex; align-items: center; gap: 4px; }

    .trend-badge {

      display: inline-flex; align-items: center; gap: 2px;

      font-size: 11px; font-weight: 600; padding: 2px 6px;

      border-radius: var(--radius-full);

    }

    .trend-badge.up { background: var(--admin-success-pale); color: var(--color-success); }

    .trend-badge.down { background: var(--admin-danger-pale); color: var(--admin-danger); }

    .trend-badge.flat { background: var(--admin-bg); color: var(--admin-text-secondary); }



    /* Compact KPI (no card) */

    .kpi-compact {

      display: flex; flex-direction: column; gap: 2px;

      padding: 0 var(--space-md); border-right: 1px solid var(--admin-border);

    }

    .kpi-compact:last-child { border-right: none; }

    .kpi-compact .label { font-size: 11px; color: var(--admin-text-tertiary); }

    .kpi-compact .value { font-size: 20px; font-weight: 600; font-family: var(--font-heading); }



    /* Tables */

    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }

    .data-table thead th {

      text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 600;

      color: var(--admin-text-tertiary); text-transform: uppercase; letter-spacing: 0.5px;

      border-bottom: 1px solid var(--admin-border); white-space: nowrap;

      position: sticky; top: 0; background: var(--admin-surface); z-index: 1;

    }

    .data-table tbody td { padding: 12px 16px; border-bottom: 1px solid var(--admin-border); }

    .data-table tbody tr { transition: background var(--transition-fast); cursor: pointer; }

    .data-table tbody tr:hover { background: var(--admin-accent-pale); }

    .data-table .mono { font-family: var(--font-mono); font-size: 12px; }

    .data-table td.num, .data-table th.num { text-align: right; font-variant-numeric: tabular-nums; }

    .data-table td.nowrap, .data-table th.nowrap { white-space: nowrap; }

    .data-table td.center, .data-table th.center { text-align: center; }

    .table-wrap { background: var(--admin-surface); border: 1px solid var(--admin-border); border-radius: var(--radius-lg); overflow-x: auto; }



    /* Badges */

    .badge {

      display: inline-flex; align-items: center; gap: 3px;

      font-size: 11px; font-weight: 600; padding: 3px 8px;

      border-radius: var(--radius-full); white-space: nowrap;

    }

    .badge-completed { background: var(--admin-success-pale); color: var(--color-success); }

    .badge-processing { background: var(--admin-info-pale); color: var(--admin-info); }

    .badge-pending { background: var(--admin-warning-pale); color: var(--admin-warning); }

    .badge-shipped { background: #EDE9FE; color: #7C3AED; }

    .badge-cancelled { background: var(--admin-bg); color: var(--admin-text-secondary); }

    .badge-refunded { background: var(--admin-danger-pale); color: var(--admin-danger); }

    .badge-new { background: var(--admin-info-pale); color: var(--admin-info); }

    .badge-repeat { background: var(--admin-accent-pale); color: var(--admin-accent); }

    .badge-vip { background: #FEF3C7; color: #92400E; }

    .badge-low { background: var(--admin-warning-pale); color: var(--admin-warning); }

    .badge-out { background: var(--admin-danger-pale); color: var(--admin-danger); }

    .badge-active { background: var(--admin-success-pale); color: var(--color-success); }



    /* Buttons */

    .btn {

      display: inline-flex; align-items: center; gap: 6px;

      padding: 8px 14px; font-size: 13px; font-weight: 500;

      border-radius: var(--radius-md); transition: all var(--transition-fast);

    }

    .btn-primary { background: var(--admin-accent); color: #fff; }

    .btn-primary:hover { background: var(--admin-accent-hover); transform: translateY(-1px); box-shadow: var(--shadow-sm); }

    .btn-primary:active { transform: translateY(0); }

    .btn-secondary { background: var(--admin-surface); color: var(--admin-text-secondary); border: 1px solid var(--admin-border-strong); }

    .btn-secondary:hover { background: var(--admin-bg); color: var(--admin-text-primary); }

    .btn-ghost { color: var(--admin-text-secondary); padding: 6px 10px; }

    .btn-ghost:hover { background: var(--admin-bg); color: var(--admin-text-primary); }

    .btn-sm { padding: 5px 10px; font-size: 12px; }

    .btn-danger { background: var(--admin-danger); color: #fff; }

    .btn-danger:hover { background: #B91C1C; }



    /* Toolbar */

    .toolbar {

      display: flex; align-items: center; gap: var(--space-sm);

      margin-bottom: var(--space-md); flex-wrap: wrap;

    }

    .toolbar .spacer { flex: 1; }

    .search-input {

      padding: 8px 12px; border: 1px solid var(--admin-border-strong);

      border-radius: var(--radius-md); width: 240px;

      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);

    }

    .search-input:focus { outline: none; border-color: var(--admin-accent); box-shadow: 0 0 0 3px var(--admin-accent-pale); }

    .filter-select {

      padding: 8px 12px; border: 1px solid var(--admin-border-strong);

      border-radius: var(--radius-md); background: var(--admin-surface);

      cursor: pointer; font-size: 13px;

    }



    /* Cards / Panels */

    .panel { background: var(--admin-surface); border: 1px solid var(--admin-border); border-radius: var(--radius-lg); padding: var(--space-lg); margin-bottom: var(--space-md); }

    .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-md); }

    .panel-header h3 { font-size: 14px; font-weight: 600; }



    .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-md); }

    .grid-2-even { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md); }



    /* Chart container */

    .chart-container { position: relative; }

    .chart-container canvas { max-height: 320px; }

    .chart-container.small canvas { max-height: 240px; }



    /* Time range toggle */

    .time-toggle { display: flex; gap: 2px; background: var(--admin-bg); border-radius: var(--radius-md); padding: 2px; }

    .time-toggle button {

      padding: 4px 10px; font-size: 12px; font-weight: 500;

      border-radius: var(--radius-sm); color: var(--admin-text-secondary);

      transition: all var(--transition-fast);

    }

    .time-toggle button.active { background: var(--admin-surface); color: var(--admin-accent); box-shadow: var(--shadow-xs); }



    /* Pagination */

    .pagination {

      display: flex; align-items: center; justify-content: center;

      gap: var(--space-sm); padding: var(--space-md); font-size: 12px; color: var(--admin-text-secondary);

    }

    .pagination button {

      padding: 6px 10px; border: 1px solid var(--admin-border-strong);

      border-radius: var(--radius-sm); font-size: 12px;

      transition: all var(--transition-fast);

    }

    .pagination button:hover:not(:disabled) { background: var(--admin-accent-pale); border-color: var(--admin-accent); color: var(--admin-accent); }

    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }



    /* Modal */

    #modalContainer { display: none; }

    #modalContainer.show { display: block; }

    .modal-overlay {

      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200;

      display: flex; align-items: center; justify-content: center; padding: var(--space-xl);

      animation: overlayIn 200ms ease;

    }

    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-card {

      background: var(--admin-surface); border-radius: var(--radius-lg);

      box-shadow: var(--shadow-lg); max-width: 720px; width: 100%;

      max-height: 80vh; overflow-y: auto;

      animation: modalIn 250ms ease;

    }

    @keyframes modalIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .modal-header {

      display: flex; align-items: center; justify-content: space-between;

      padding: var(--space-lg) var(--space-xl); border-bottom: 1px solid var(--admin-border);

      position: sticky; top: 0; background: var(--admin-surface); z-index: 1;

    }

    .modal-header h3 { font-size: 16px; font-weight: 600; }

    .modal-close { font-size: 20px; color: var(--admin-text-tertiary); padding: 4px; line-height: 1; }

    .modal-close:hover { color: var(--admin-text-primary); }

    .modal-body { padding: var(--space-xl); }

    .modal-footer {

      display: flex; justify-content: flex-end; gap: var(--space-sm);

      padding: var(--space-lg) var(--space-xl); border-top: 1px solid var(--admin-border);

      position: sticky; bottom: 0; background: var(--admin-surface);

    }



    /* Warning Banner */

    .warning-banner {

      display: flex; align-items: flex-start; gap: 10px;

      padding: 12px 16px; border-radius: var(--radius-md);

      margin-bottom: var(--space-md); font-size: 13px; line-height: 1.5;

    }

    .warning-banner > div { flex: 1; min-width: 0; word-wrap: break-word; }

    .warning-banner.warn { background: var(--admin-warning-pale); color: #92400E; }

    .warning-banner.danger { background: var(--admin-danger-pale); color: #991B1B; }

    .warning-banner.info { background: var(--admin-info-pale); color: #1E40AF; }

    .warning-banner svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }



    /* Consent Icons */

    .consent-icons { display: flex; gap: 4px; }

    .consent-icon {

      width: 20px; height: 20px; border-radius: var(--radius-full);

      display: flex; align-items: center; justify-content: center;

      font-size: 9px; font-weight: 700; cursor: help;

    }

    .consent-legend { display: flex; gap: var(--space-md); font-size: 11px; color: var(--admin-text-tertiary); margin-top: var(--space-sm); padding: 0 var(--space-md); }

    .consent-legend span { display: flex; align-items: center; gap: 4px; }

    .consent-legend .dot { width: 10px; height: 10px; border-radius: 50%; }

    .consent-icon.yes { background: var(--admin-success-pale); color: var(--color-success); }

    .consent-icon.no { background: var(--admin-bg); color: var(--admin-text-tertiary); border: 1px solid var(--admin-border); }



    /* Country badge */

    .country-badge {

      display: inline-flex; align-items: center; gap: 4px;

      font-size: 11px; font-weight: 600; padding: 2px 8px;

      border-radius: var(--radius-sm); background: var(--admin-bg);

      color: var(--admin-text-secondary);

    }



    /* Funnel */

    .funnel-container { 
      padding: var(--space-md) 0; 
      overflow-x: auto; /* 允许水平滚动，避免内容被截断 */
    }

    .funnel-stage {

      display: flex; align-items: center; margin-bottom: 4px;

      transition: transform var(--transition-base);

      animation: funnelSlide 400ms ease backwards;

    }

    @keyframes funnelSlide { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }

    .funnel-bar {
      height: 44px; background: var(--admin-accent); color: #fff;
      display: flex; align-items: center; padding: 0 16px;
      font-size: 13px; font-weight: 500; border-radius: var(--radius-sm);
      transition: filter var(--transition-fast); position: relative;
      min-width: 120px; /* 确保文本不会被挤压 */
      white-space: nowrap; /* 防止文本换行 */
    }

    .funnel-bar:hover { filter: brightness(1.1); }

    .funnel-info { 
      margin-left: 12px; 
      font-size: 12px; 
      color: var(--admin-text-secondary); 
      white-space: nowrap;
      flex-shrink: 0; /* 防止信息被挤压 */
    }

    .funnel-drop { color: var(--admin-danger); font-size: 11px; margin-left: 8px; }



    /* Heatmap — Horizontal Bar Chart */

    :root {
      --hm-card-bg:         #1a1c23;
      --hm-card-border:     rgba(255, 255, 255, 0.06);
      --hm-card-radius:     12px;
      --hm-rank-color:      #6b6f76;
      --hm-rank-size:       11px;
      --hm-label-color:     #e0e0e0;
      --hm-label-size:      13px;
      --hm-value-color:     #C9A96E;
      --hm-value-size:      13px;
      --hm-bar-height:      6px;
      --hm-bar-radius:      3px;
      --hm-bar-track-bg:    rgba(255, 255, 255, 0.04);
      --hm-bar-fill-from:   rgba(201, 169, 110, 0.25);
      --hm-bar-fill-to:     #C9A96E;
      --hm-bar-top1-from:   rgba(201, 169, 110, 0.4);
      --hm-bar-top1-to:     #e2c68a;
      --hm-row-gap:         16px;
      --hm-row-hover-bg:    rgba(255, 255, 255, 0.03);
      --hm-legend-color:    #4a4d54;
    }

    .heatmap-bar-list {
      display: flex;
      flex-direction: column;
      gap: var(--hm-row-gap);
      padding: 12px 16px 8px;
    }

    .heatmap-bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 8px;
      border-radius: var(--hm-card-radius);
      transition: background-color 0.2s;
      opacity: 0;
      transform: translateY(6px);
      animation: hm-row-enter 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .heatmap-bar-row:hover {
      background-color: var(--hm-row-hover-bg);
    }

    .hm-rank {
      width: 28px;
      font-size: var(--hm-rank-size);
      font-weight: 600;
      color: var(--hm-rank-color);
      text-align: right;
      flex-shrink: 0;
    }

    .heatmap-bar-row.is-top1 .hm-rank {
      color: #e2c68a;
    }

    .hm-label {
      width: 180px;
      font-size: var(--hm-label-size);
      color: var(--hm-label-color);
      flex-shrink: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hm-value {
      width: 60px;
      font-size: var(--hm-value-size);
      font-weight: 600;
      color: var(--hm-value-color);
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .hm-bar-wrap {
      flex: 1;
      height: var(--hm-bar-height);
      background: var(--hm-bar-track-bg);
      border-radius: var(--hm-bar-radius);
      overflow: hidden;
    }

    .hm-bar-fill {
      height: 100%;
      border-radius: var(--hm-bar-radius);
      background: linear-gradient(90deg, var(--hm-bar-fill-from), var(--hm-bar-fill-to));
      transform: scaleX(0);
      transform-origin: left center;
      animation: hm-bar-grow 0.6s ease-out forwards;
    }

    .heatmap-bar-row.is-top1 .hm-bar-fill {
      background: linear-gradient(90deg, var(--hm-bar-top1-from), var(--hm-bar-top1-to));
    }

    .heatmap-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--hm-legend-color);
      margin-top: 8px;
      justify-content: center;
    }

    .heatmap-gradient {
      width: 120px;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--hm-bar-fill-from), var(--hm-bar-fill-to));
    }

    @keyframes hm-row-enter {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes hm-bar-grow {
      from { transform: scaleX(0); }
      to   { transform: scaleX(var(--bar-target, 1)); }
    }

    /* Responsive: <768px */
    @media (max-width: 767px) {
      .hm-rank { display: none; }
      .hm-label { font-size: 12px; width: 140px; }
      .hm-value { font-size: 12px; width: 50px; }
      .hm-bar-wrap { height: 5px; }
      .heatmap-bar-list { gap: 12px; padding: 8px 12px 6px; }
      .heatmap-bar-row { gap: 8px; }
    }



    /* Dwell time bars */

    .dwell-bar-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }

    .dwell-bar-label { width: 160px; font-size: 12px; color: var(--admin-text-secondary); flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .dwell-bar-track { flex: 1; height: 20px; background: var(--admin-bg); border-radius: var(--radius-sm); overflow: hidden; }

    .dwell-bar-fill { height: 100%; background: var(--admin-accent); border-radius: var(--radius-sm); transition: width 600ms ease; }

    .dwell-bar-value { width: 50px; font-size: 12px; font-weight: 500; text-align: right; flex-shrink: 0; }



    /* SEO Score Ring */

    .score-ring-container { display: flex; align-items: center; gap: var(--space-xl); }

    .score-ring { position: relative; width: 120px; height: 120px; }

    .score-ring svg { transform: rotate(-90deg); }

    .score-ring .score-text {

      position: absolute; inset: 0; display: flex; flex-direction: column;

      align-items: center; justify-content: center;

    }

    .score-ring .score-num { font-family: var(--font-heading); font-size: 32px; font-weight: 700; }

    .score-ring .score-label { font-size: 10px; color: var(--admin-text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; }



    /* SEO Factor List */

    .factor-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .factor-item {

      display: flex; align-items: flex-start; gap: 8px;

      padding: 10px 12px; border: 1px solid var(--admin-border);

      border-radius: var(--radius-md); font-size: 12px;

    }

    .factor-icon { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }

    .factor-name { font-weight: 600; color: var(--admin-text-primary); }

    .factor-detail { color: var(--admin-text-secondary); margin-top: 2px; }

    .factor-mini-bar { height: 3px; background: var(--admin-bg); border-radius: var(--radius-full); margin-top: 6px; overflow: hidden; }

    .factor-mini-fill { height: 100%; border-radius: var(--radius-full); }



    /* Rank change arrow */

    .rank-change { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; }

    .rank-change.up { color: var(--color-success); }

    .rank-change.down { color: var(--admin-danger); }

    .rank-change.flat { color: var(--admin-text-tertiary); }

    .rank-num { font-weight: 700; font-size: 14px; }

    .rank-num.top3 { color: var(--color-success); }

    .rank-num.top10 { color: var(--admin-accent); }

    .rank-num.top20 { color: var(--admin-warning); }

    .rank-num.low { color: var(--admin-danger); }



    /* Compliance status items */

    .compliance-status { display: flex; flex-direction: column; gap: 8px; }

    .compliance-item {

      display: flex; align-items: center; gap: 8px;

      padding: 10px 12px; border: 1px solid var(--admin-border);

      border-radius: var(--radius-md); font-size: 13px;

    }

    .status-dot { width: 8px; height: 8px; border-radius: var(--radius-full); flex-shrink: 0; }

    .status-dot.pass { background: var(--color-success); }

    .status-dot.warn { background: var(--admin-warning); }

    .status-dot.fail { background: var(--admin-danger); }

    .status-dot.pending { background: var(--admin-text-tertiary); }



    /* Timeline */

    .timeline { position: relative; padding-left: 20px; }

    .timeline::before { content: ''; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--admin-border); }

    .timeline-item { position: relative; padding-bottom: var(--space-md); }

    .timeline-item::before {

      content: ''; position: absolute; left: -19px; top: 4px;

      width: 12px; height: 12px; border-radius: var(--radius-full);

      background: var(--admin-border); border: 2px solid var(--admin-surface);

    }

    .timeline-item.done::before { background: var(--color-success); }

    .timeline-item .time { font-size: 11px; color: var(--admin-text-tertiary); }

    .timeline-item .text { font-size: 13px; font-weight: 500; }



    /* Info grid */

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .info-item { font-size: 13px; }

    .info-item .key { color: var(--admin-text-tertiary); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }

    .info-item .val { font-weight: 500; }



    /* No access page */

    .no-access {

      display: flex; flex-direction: column; align-items: center; justify-content: center;

      padding: var(--space-4xl, 6rem); text-align: center;

    }

    .no-access svg { width: 48px; height: 48px; color: var(--admin-text-tertiary); margin-bottom: var(--space-md); }

    .no-access h3 { font-size: 18px; font-weight: 600; margin-bottom: var(--space-sm); }

    .no-access p { color: var(--admin-text-secondary); }



    /* Spinner */

    .spinner {

      width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);

      border-top-color: #fff; border-radius: var(--radius-full);

      animation: spin 600ms linear infinite; display: inline-block;

    }

    @keyframes spin { to { transform: rotate(360deg); } }



    /* Skeleton */

    .skeleton { background: linear-gradient(90deg, var(--admin-bg) 25%, var(--admin-border) 50%, var(--admin-bg) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius-sm); }

    @keyframes shimmer { to { background-position: -200% 0; } }



    /* Referral Program */

    .referral-tier-badge {

      display: inline-flex; align-items: center; justify-content: center;

      min-width: 28px; height: 28px; padding: 0 8px;

      border-radius: var(--radius-full); color: #fff;

      font-size: 11px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,0.3);

      box-shadow: var(--shadow-xs); white-space: nowrap;

    }

    .referral-funnel .funnel-bar {

      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));

    }

    .referral-code-badge {

      display: inline-flex; align-items: center; justify-content: center;

      min-width: 28px; height: 28px; padding: 0 10px;

      border-radius: var(--radius-sm); background: var(--admin-accent-pale);

      color: var(--admin-accent); border: 1px solid var(--admin-accent);

      font-size: 11px; font-weight: 700; font-family: 'Courier New', monospace;

      letter-spacing: 0.5px; white-space: nowrap;

    }

    .data-table tbody tr[style*="cursor:pointer"]:hover {

      background: var(--admin-accent-pale);

    }



    /* Responsive */

    @media (max-width: 1279px) {

      .kpi-grid.cols-6 { grid-template-columns: repeat(3, 1fr); }

    }

    @media (max-width: 1023px) {

      #sidebar { width: var(--sidebar-collapsed); }

      #sidebar .nav-item span, #sidebar .sidebar-header .logo span, #sidebar .sidebar-user .info, #sidebar .logout-btn { display: none; }

      #sidebar .sidebar-header .logo { font-size: 16px; }

      #sidebar .nav-item { justify-content: center; padding: 12px; }

      #mainWrap { margin-left: var(--sidebar-collapsed); }

      .kpi-grid.cols-4, .kpi-grid.cols-6 { grid-template-columns: repeat(2, 1fr); }

      .grid-2, .grid-2-even { grid-template-columns: 1fr; }

      .grid-3 { grid-template-columns: 1fr; }

      .factor-list { grid-template-columns: 1fr; }

      .info-grid { grid-template-columns: 1fr; }

    }

    @media (max-width: 767px) {

      #sidebar { transform: translateX(-100%); }

      #sidebar.mobile-open { transform: translateX(0); }

      #mainWrap { margin-left: 0; }

      .kpi-grid.cols-4, .kpi-grid.cols-6 { grid-template-columns: 1fr; }

      .kpi-compact { border-right: none; border-bottom: 1px solid var(--admin-border); padding: var(--space-sm) 0; }

      .search-input { width: 100%; }

      #mainContent { padding: var(--space-md); }

      .score-ring-container { flex-direction: column; }

    }

  </style>

</head>

  function t(key) {

    var e = adminI18n[key];

    return e ? (e[adminLang] || e.en) : key;

  }

  function switchLang(lang) {

    adminLang = lang;

    try { localStorage.setItem('smt-admin-lang', lang); } catch(e) {}

    document.getElementById('langEn').classList.toggle('active', lang === 'en');

    document.getElementById('langZh').classList.toggle('active', lang === 'zh');

    if (document.getElementById('langTw')) document.getElementById('langTw').classList.toggle('active', lang === 'tw');

    document.querySelectorAll('[data-i18n]').forEach(function(el) {

  function handleRoute() {

    var hash = location.hash || '#/dashboard';

    var route = ROUTES[hash];

    var content = document.getElementById('mainContent');

    var titleEl = document.getElementById('topbarTitle');



    if (!Auth.currentUser()) { showLogin(); return; }

    hideLogin();



    // Render sidebar

    renderSidebar(hash);



    if (!route) {

      content.innerHTML = '<div class="no-access"><h3>404</h3><p>' + t('common.pageNotFound') + '</p></div>';

      titleEl.textContent = '404';

      return;

    }

    if (!Auth.can(route.perm)) {

      content.innerHTML = '<div class="no-access"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg><h3>' + t('common.noAccess') + '</h3></div>';

      titleEl.textContent = t(route.labelKey);

      return;

    }



    titleEl.textContent = t(route.labelKey);

    content.innerHTML = '';

    content.style.animation = 'none';

    void content.offsetHeight;

    content.style.animation = '';



    var viewFn = VIEW_FUNCTIONS[hash];

    if (viewFn) viewFn(content);

  }

  function renderSidebar(activeHash) {

    var nav = document.getElementById('sidebarNav');

    var html = '';

    for (var hash in ROUTES) {

      var r = ROUTES[hash];

      if (!Auth.can(r.perm)) continue;

      html += '<div class="nav-item' + (hash === activeHash ? ' active' : '') + '" onclick="location.hash=\'' + hash + '\'">' + r.icon + '<span>' + t(r.labelKey) + '</span></div>';

    }

    nav.innerHTML = html;



    var u = Auth.currentUser();

    document.getElementById('userName').textContent = t('user.admin');



    document.getElementById('userRole').textContent = t('user.role.' + u.role);

    document.getElementById('userAvatar').textContent = u.name.charAt(0);

    var rb = document.getElementById('topbarRole');

    rb.textContent = t('user.role.' + u.role);

    rb.className = 'role-badge ' + u.role;

  }

  window.renderOrdersTable = function() {

    var orders = MockDB.getOrders();

    var q = (document.getElementById('orderSearch')||{}).value || '';

    var sf = (document.getElementById('orderStatusFilter')||{}).value || '';

    var filtered = orders.filter(function(o) {

      if (sf && o.status !== sf) return false;

      if (q) { var s = (o.orderNumber + o.customer.name + o.customer.email).toLowerCase(); if (s.indexOf(q.toLowerCase()) === -1) return false; }

      return true;

    });

    var perPage = 10, page = window._orderPage || 0;

    var pages = Math.ceil(filtered.length / perPage);

    if (page >= pages) page = 0;

    var slice = filtered.slice(page*perPage, (page+1)*perPage);

    document.getElementById('ordersBody').innerHTML = slice.map(function(o) {

      return '<tr onclick="showOrderDetail(\'' + o.id + '\')"><td class="mono">' + o.orderNumber + '</td><td>' + escapeHtml(o.customer.name) + '</td><td class="center">' + o.items.length + ' ' + t('common.items') + '</td><td class="num">' + fmtMoney(o.amounts.total) + '</td><td>' + t('payment.' + o.payment.method) + '</td><td>' + statusBadge(o.status) + '</td><td class="nowrap">' + fmtDate(o.createdAt) + '</td></tr>';

    }).join('');

      '<button onclick="window._orderPage=' + Math.max(0,page-1) + ';renderOrdersTable()" ' + (page===0?'disabled':'')+'>' + t('order.prev') + '</button>' +

      '<span>' + t('order.showing') + ' ' + (page*perPage+1) + '-' + Math.min((page+1)*perPage, filtered.length) + ' ' + t('order.of') + ' ' + filtered.length + '</span>' +

      '<button onclick="window._orderPage=' + Math.min(pages-1,page+1) + ';renderOrdersTable()" ' + (page>=pages-1?'disabled':'')+'>' + t('order.next') + '</button>';

  };

  function compactKPI(labelKey, value) {

    return '<div class="kpi-compact"><div class="label">' + t(labelKey) + '</div><div class="value">' + value + '</div></div>';

  }

  function kpiCardNoHover(label, value) {

    return '<div class="kpi-card"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';

  }



  function renderFunnel(funnel) {
    var html = '';
    var maxCount = funnel[0].count;
    funnel.forEach(function(stage, i) {
      var pct = stage.count / maxCount * 100;
      // 确保最小宽度为 15%，避免文本被挤压
      var width = Math.max(pct, 15);
      var dropRate = i > 0 ? ((funnel[i-1].count - stage.count) / funnel[i-1].count * 100).toFixed(1) : null;
      html += '<div class="funnel-stage" style="animation-delay:' + (i*100) + 'ms">' +
        '<div class="funnel-bar" style="width:' + width + '%">' + (stage.stageKey ? t(stage.stageKey) : stage.stage) + '</div>' +
        '<div class="funnel-info">' + stage.count.toLocaleString() + ' (' + stage.rate + '%)' +
        (dropRate ? '<span class="funnel-drop">-' + dropRate + '% ' + t('analytics.funnelDrop') + '</span>' : '') + '</div></div>';
    });
    document.getElementById('funnelContainer').innerHTML = html;
  }



  function renderDwellBars(data) {

    var maxDwell = Math.max.apply(null, data.map(function(d){ return d.avgDwell; }));

    var html = data.map(function(d) {

      var pct = d.avgDwell / maxDwell * 100;

      var pageLabel = d.pageKey ? t(d.pageKey) : d.page;

      return '<div class="dwell-bar-row"><div class="dwell-bar-label" title="' + pageLabel + '">' + pageLabel + '</div><div class="dwell-bar-track"><div class="dwell-bar-fill" style="width:0%" data-w="' + pct + '"></div></div><div class="dwell-bar-value">' + fmtTime(d.avgDwell) + '</div></div>';

    }).join('');

    document.getElementById('dwellBars').innerHTML = html;

    setTimeout(function() {

      document.querySelectorAll('#dwellBars .dwell-bar-fill').forEach(function(el){ el.style.width = el.getAttribute('data-w') + '%'; });

    }, 100);

  }



  function renderHeatmap(data) {
    // Sort by clicks descending
    var sorted = data.slice().sort(function(a, b) { return b.clicks - a.clicks; });
    var maxClicks = sorted[0].clicks;
    var html = '<div class="heatmap-bar-list">';
    sorted.forEach(function(d, i) {
      var pct = (d.clicks / maxClicks * 100).toFixed(1);
      var lbl = d.labelKey ? t(d.labelKey) : d.label;
      var isTop1 = (i === 0);
      var delay = (i * 60) + 'ms';
      var barDelay = (i * 100 + 100) + 'ms';
      html += '<div class="heatmap-bar-row' + (isTop1 ? ' is-top1' : '') + '" style="animation-delay:' + delay + '">';
      html += '<span class="hm-rank">#' + (i + 1) + '</span>';
      html += '<span class="hm-label">' + lbl + '</span>';
      html += '<span class="hm-value">' + d.clicks.toLocaleString() + '</span>';
      html += '<div class="hm-bar-wrap"><div class="hm-bar-fill" style="--bar-target:' + (pct / 100) + ';animation-delay:' + barDelay + '"></div></div>';
      html += '</div>';
    });
    html += '</div>';
    document.getElementById('heatmapContainer').innerHTML = html;
  }

    var prods = MockDB.products;

    var totalStock = 0, lowStock = 0, outStock = 0;

    var lowStockItems = [];

    prods.forEach(function(p){ p.tiers.forEach(function(t){

      totalStock += t.stock;

      if (t.stock <= (t.lowStockThreshold || 50)) lowStock++;

      if (t.stock === 0) outStock++;

      if (t.stock <= (t.reorderPoint || 30)) lowStockItems.push({ product: p.name[adminLang], tier: t.name[adminLang], stock: t.stock, reorderPoint: t.reorderPoint });

    }); });

    var alertBanner = lowStockItems.length > 0 ? '<div class="warning-banner warn"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><div><strong>' + t('prod.lowStockAlert') + ':</strong> ' + lowStockItems.length + ' ' + t('prod.lowStockAlertMsg') + '. ' + lowStockItems.map(function(it){ return it.product + ' (' + it.tier + '): ' + it.stock; }).join(' · ') + '</div></div>' : '';

    c.innerHTML =

      '<div class="page-header"><h2>' + t('prod.title') + '</h2><p>' + t('prod.subtitle') + '</p></div>' +

      '<div class="kpi-grid cols-3">' +

        kpiCardNoHover(t('prod.totalStock'), totalStock + ' ' + t('prod.units')) +

        '<div class="kpi-card"><div class="label">' + t('prod.lowStock') + '</div><div class="value" style="color:var(--admin-warning)">' + lowStock + '</div></div>' +

        '<div class="kpi-card"><div class="label">' + t('prod.outStock') + '</div><div class="value" style="color:var(--admin-danger)">' + outStock + '</div></div>' +

      '</div>' +

      alertBanner +

      '<div class="table-wrap"><table class="data-table"><thead><tr><th>' + t('prod.col.product') + '</th><th>' + t('prod.col.tier') + '</th><th class="num">' + t('prod.col.price') + '</th><th class="num">' + t('prod.col.stock') + '</th><th>' + t('prod.col.sku') + '</th><th>' + t('prod.col.status') + '</th><th class="num">' + t('prod.col.sold') + '</th><th class="num">' + t('prod.col.revenue') + '</th></tr></thead><tbody>' +

        prods.map(function(p) {

          return p.tiers.map(function(tier, i) {

            var threshold = tier.lowStockThreshold || 50;

            var stockBadge = tier.stock === 0 ? '<span class="badge badge-out">' + t('prod.outStock') + '</span>' : tier.stock <= threshold ? '<span class="badge badge-low">' + t('prod.lowStock') + '</span>' : '<span class="badge badge-active">' + t('prod.inStock') + '</span>';

            var lowIcon = tier.stock <= threshold ? ' <span title="' + t('prod.lowStockAlert') + '" style="color:var(--admin-warning)">⚠</span>' : '';

            return '<tr onclick="showProductDetail(\'' + p.id + '\',\'' + tier.id + '\')"><td>' + (i===0?'<strong>'+p.name[adminLang]+'</strong>':'') + '</td><td>' + tier.name[adminLang] + '</td><td class="num">' + fmtMoney(tier.price) + (tier.originalPrice ? ' <span style="text-decoration:line-through;color:var(--admin-text-tertiary)">'+fmtMoney(tier.originalPrice)+'</span>' : '') + '</td><td class="num">' + tier.stock + lowIcon + '</td><td class="mono">' + tier.sku + '</td><td>' + stockBadge + '</td><td class="num">' + (i===0 ? p.totalSold : '') + '</td><td class="num">' + (i===0 ? fmtMoney(p.revenue) : '') + '</td></tr>';

          }).join('');

        }).join('') +

      '</tbody></table></div>';

  };

        '<button class="btn btn-secondary" id="adjustAddBtn" onclick="toggleStockAdjustUI(\'add\')">' + t('prod.stockAdjust.add') + '</button>' +

        '<button class="btn btn-secondary" id="adjustRemoveBtn" onclick="toggleStockAdjustUI(\'remove\')">' + t('prod.stockAdjust.remove') + '</button>' +

      '</div>' +

      '<input type="number" id="stockAdjustAmount" min="1" placeholder="1" style="width:100%;padding:8px 12px;border:1px solid var(--admin-border-strong);border-radius:var(--radius-md);margin-bottom:var(--space-md)" value="1">' +

      '<div class="section-title">' + t('prod.stockAdjust.reason') + '</div>' +

      '<input type="text" id="stockAdjustReason" placeholder="' + t('prod.stockAdjust.addReason') + '" style="width:100%;padding:8px 12px;border:1px solid var(--admin-border-strong);border-radius:var(--radius-md)">' +

      '<input type="hidden" id="stockAdjustType" value="add">';

    var footer = '<button class="btn btn-primary" onclick="confirmStockAdjust(\'' + pid + '\',\'' + tid + '\')">' + t('prod.stockAdjust.confirm') + '</button>' +

      '<button class="btn btn-secondary" onclick="closeModal()">' + t('common.cancel') + '</button>';

    openModal(t('prod.stockAdjust.title'), body, footer);

    toggleStockAdjustUI('add');

  window.toggleStockAdjustUI = function(type) {

    document.getElementById('stockAdjustType').value = type;

    var addBtn = document.getElementById('adjustAddBtn');

    var removeBtn = document.getElementById('adjustRemoveBtn');

    var reasonInput = document.getElementById('stockAdjustReason');

    addBtn.className = type === 'add' ? 'btn btn-primary' : 'btn btn-secondary';

    removeBtn.className = type === 'remove' ? 'btn btn-primary' : 'btn btn-secondary';

    reasonInput.placeholder = type === 'add' ? t('prod.stockAdjust.addReason') : t('prod.stockAdjust.removeReason');

  };



  window.confirmStockAdjust = function(pid, tid) {

    var p = MockDB.products.find(function(x){ return x.id === pid; });

    var tier = p.tiers.find(function(t){ return t.id === tid; });

    var type = document.getElementById('stockAdjustType').value;

    var amount = parseInt(document.getElementById('stockAdjustAmount').value, 10);

    var reason = document.getElementById('stockAdjustReason').value.trim() || (type === 'add' ? t('prod.stockAdjust.add') : t('prod.stockAdjust.remove'));

    if (!amount || amount <= 0) return;

    var delta = type === 'add' ? amount : -amount;

    if (type === 'remove' && amount > tier.stock) {

      alert(t('prod.outStock'));

      return;

    }

    tier.stock += delta;

    tier.stockMovements = tier.stockMovements || [];

    tier.stockMovements.push({ date: new Date().toISOString(), type: type === 'add' ? 'added' : 'removed', amount: delta, reason: reason, balance: tier.stock });

    closeModal();

    handleRoute();

  };

  function renderReferralFunnel(funnel) {

    var html = '';

    var maxCount = funnel[0].count;

    funnel.forEach(function(stage, i) {

      var pct = stage.count / maxCount * 100;

      var dropRate = i > 0 ? ((funnel[i-1].count - stage.count) / funnel[i-1].count * 100).toFixed(1) : null;

      var convRate = i > 0 ? (stage.count / funnel[i-1].count * 100).toFixed(1) : '100';

      html += '<div class="funnel-stage" style="animation-delay:' + (i*100) + 'ms">' +

        '<div class="funnel-bar" style="width:' + pct + '%">' + t(stage.stageKey) + '</div>' +

        '<div class="funnel-info">' + stage.count.toLocaleString() +

        (dropRate ? '<span class="funnel-drop">-' + dropRate + '% ' + t('analytics.funnelDrop') + '</span>' : '') + '</div></div>';

    });

    var el = document.getElementById('referralFunnelContainer');

    if (el) el.innerHTML = html;

  }

    });

  // ========== Login ==========

  function handleLogin(e) {

    e.preventDefault();

    var u = document.getElementById('loginUser').value.trim();

    var p = document.getElementById('loginPass').value;

    var err = document.getElementById('loginError');

    var session = Auth.login(u, p);

    if (!session) { err.classList.add('show'); return false; }

    err.classList.remove('show');

    location.hash = '#/dashboard';

    handleRoute();

    return false;

  }

  function handleLogout() { Auth.logout(); }

  function showLogin() {

    document.getElementById('loginScreen').style.display = 'flex';

    document.getElementById('appLayout').classList.remove('show');

  }

  function hideLogin() {

    document.getElementById('loginScreen').style.display = 'none';

    document.getElementById('appLayout').classList.add('show');

  }

    document.querySelectorAll('[data-i18n]').forEach(function(el) {

      el.textContent = t(el.getAttribute('data-i18n'));

    });

  }

  window.addEventListener('hashchange', handleRoute);

  window.addEventListener('DOMContentLoaded', function() {

    // Restore theme

    try {

      var savedTheme = localStorage.getItem('smt-admin-theme');

      if (savedTheme) {

        document.documentElement.setAttribute('data-theme', savedTheme);

        updateThemeIcon(savedTheme);

      } else {

        updateThemeIcon('light');

      }

    } catch(e) { updateThemeIcon('light'); }

    // Restore language

    try {

      var savedLang = localStorage.getItem('smt-admin-lang');

      if (savedLang && savedLang !== 'en') {

        adminLang = savedLang;

      }

    } catch(e) {}

    document.getElementById('langEn').classList.toggle('active', adminLang === 'en');

    document.getElementById('langZh').classList.toggle('active', adminLang === 'zh');

    if (document.getElementById('langTw')) document.getElementById('langTw').classList.toggle('active', adminLang === 'tw');

    applyI18n();

    if (Auth.currentUser()) { hideLogin(); handleRoute(); }

    else { showLogin(); }

  });

  </script>

</body>

</html>
